<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCat sprites preview</title>
<style>
  :root { --bg:#15171C; --panel:#1E2128; --line:#2C3038; --text:#E8E6E1; --muted:#9AA0AA; --soft:#C9CDD3; --gold:#F2A65A; --stage:#15171C; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:28px 24px 64px; }
  h1 { font-size:22px; margin:0 0 4px; letter-spacing:-0.01em; }
  h2 { font-size:15px; margin:36px 0 12px; color:var(--soft); font-weight:600; text-transform:uppercase; letter-spacing:0.06em; }
  p.lede { margin:0; color:var(--muted); }
  code, .mono { font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size:12.5px; }
  .bar { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-top:16px; }
  .swatches { display:flex; gap:3px; }
  .swatches i { width:14px; height:14px; border-radius:3px; border:1px solid rgba(255,255,255,.12); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:transparent; color:var(--soft); border:0; padding:6px 12px; font:inherit; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button[aria-pressed="true"] { background:var(--panel); color:var(--gold); }
  .seg button:focus-visible { outline:2px solid var(--gold); outline-offset:-2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(208px, 1fr)); gap:14px; }
  .scenes { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 528px), 1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 8px 10px; }
  .stage { background:var(--stage); border-radius:8px; display:flex; justify-content:center; overflow:hidden; }
  body[data-bg="panel"] { --stage:#1E2128; }
  body[data-bg="panel"] .card { background:#15171C; }
  body[data-bg="wall"] .stage { background:linear-gradient(160deg,#5E93C4 0%,#8FB7A8 55%,#C9B37E 100%); }
  canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; max-width:100%; height:auto; }
  .name { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:9px 4px 0; }
  .name b { font-weight:600; }
  .tag { font-size:11px; padding:1px 7px; border-radius:999px; background:#2C3038; color:var(--soft); white-space:nowrap; }
  .tag.loop { background:#22304A; color:#7AA8F0; }
  .tag.shot { background:#3A2E20; color:#F2A65A; }
  .sub { margin:2px 4px 0; color:var(--muted); font-size:12px; }
  .sheet { background:var(--stage); border:1px solid var(--line); border-radius:12px; padding:12px; overflow:auto; }
  .sheet img { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
</style>
</head>
<body data-bg="dark">
<main>
  <h1>SCat sprites</h1>
  <p class="lede" id="lede"></p>
  <div class="bar">
    <div class="seg" role="group" aria-label="Background">
      <button type="button" data-bg="dark" aria-pressed="true">#15171C</button>
      <button type="button" data-bg="panel" aria-pressed="false">#1E2128</button>
      <button type="button" data-bg="wall" aria-pressed="false">Wallpaper</button>
    </div>
    <div class="swatches" id="swatches" aria-label="Palette"></div>
  </div>

  <h2>Cat states · 4×</h2>
  <div class="grid" id="states"></div>

  <h2>Combinations · 128×64 scene at 4×</h2>
  <div class="scenes" id="scenes"></div>

  <h2>Sheets · 2×</h2>
  <div class="sheet"><img id="catSheet" alt="cat_sheet.png"></div>
  <div class="sheet" style="margin-top:12px"><img id="ovlSheet" alt="overlays_sheet.png"></div>
</main>

// ---- atlas helpers (the same logic the app needs) ---------------------------
function frameAt(def, t) {
  const total = def.durationMs;
  if (def.loop) t = ((t % total) + total) % total;
  else if (t >= total) return def.frames[def.frames.length - 1];
  let acc = 0;
  for (const f of def.frames) { acc += f.duration; if (t < acc) return f; }
  return def.frames[def.frames.length - 1];
}
function pathAt(path, u) {
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    if (u >= a.t && u <= b.t) {
      const k = (u - a.t) / (b.t - a.t);
      return { x: Math.round(a.x + (b.x - a.x) * k), y: Math.round(a.y + (b.y - a.y) * k) };
    }
  }
  return null;
}
function blit(ctx, sheet, f, x, y) {
  ctx.drawImage(sheet, f.x, f.y, f.w, f.h, x * S, y * S, f.w * S, f.h * S);
}
// Draw one overlay at local time t (ms since it was triggered). Returns its top-left in scene px, or null.
function drawOverlay(ctx, name, t, origin) {
  const o = ATLAS.overlays[name];
  if (!o || t < 0) return null;
  let pos;
  if (o.motion) {
    const u = (t - (o.motion.delay || 0)) / o.motion.duration;
    if (u < 0 || u > 1) return null;
    pos = pathAt(o.motion.path, u);
    t -= (o.motion.delay || 0);
  } else {
    pos = o.offset || { x: 0, y: 0 };
    if (!o.loop && t >= o.durationMs) return null;
  }
  const p = { x: origin.x + pos.x, y: origin.y + pos.y };
  blit(ctx, sheets.overlays, frameAt(o, t), p.x, p.y);
  return p;
}

const M = ATLAS.meta, CAT = M.cat, SC = M.scene;
const stateNames = Object.keys(ATLAS.cat);
document.getElementById("lede").textContent =
  stateNames.length + " cat states, " + Object.keys(ATLAS.overlays).length + " overlays, " +
  M.palette.length + " colours. Frames are " + CAT.frameW + "×" + CAT.frameH + ", feet on y=" + CAT.baselineY + ".";
for (const c of M.palette) { const i = document.createElement("i"); i.style.background = c; i.title = c; document.getElementById("swatches").append(i); }
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  document.body.dataset.bg = b.dataset.bg;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
}));
document.getElementById("catSheet").src = sheets.cat.src;
document.getElementById("ovlSheet").src = sheets.overlays.src;
sheets.cat.onload = () => { document.getElementById("catSheet").width = sheets.cat.width * 2; };
sheets.overlays.onload = () => { document.getElementById("ovlSheet").width = sheets.overlays.width * 2; };

function card(parent, w, h, title, tagText, tagClass, sub) {
  const el = document.createElement("div"); el.className = "card";
  el.innerHTML = '<div class="stage"><canvas></canvas></div><div class="name"><b class="mono"></b><span class="tag"></span></div><div class="sub"></div>';
  const cv = el.querySelector("canvas"); cv.width = w * S; cv.height = h * S;
  el.querySelector("b").textContent = title;
  const tag = el.querySelector(".tag"); tag.textContent = tagText; tag.classList.add(tagClass);
  el.querySelector(".sub").textContent = sub;
  parent.append(el);
  const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
  return ctx;
}

const draws = [];
// single states
for (const name of stateNames) {
  const d = ATLAS.cat[name];
  const ctx = card(document.getElementById("states"), CAT.frameW, CAT.frameH, name,
    d.loop ? "loop" : "one-shot", d.loop ? "loop" : "shot",
    "P" + d.priority + " · " + d.frames.length + " frames · " + d.durationMs + " ms" +
    (d.holdLast ? " · holds last" : "") + (d.exit ? " · leave via " + d.exit : ""));
  // one-shots: play, hold the last frame, then (if the state has an exit transition) play that too
  const exit = !d.loop && d.exit ? ATLAS.cat[d.exit] : null, hold = d.loop ? 0 : 900;
  const cycle = d.durationMs + hold + (exit ? exit.durationMs + 500 : 0);
  draws.push(now => {
    const t = now % cycle;
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    const f = exit && t >= d.durationMs + hold ? frameAt(exit, t - d.durationMs - hold) : frameAt(d, t);
    blit(ctx, sheets.cat, f, 0, 0);
  });
}

  sub: "alert holds its last frame; when the app moves on it plays alert_end so the cat eases back to idle.",
  steps: [{ state: "idle", ms: 1490 }, { state: "alert", ms: dur("alert") + 500 }]
    .concat(has("alert_end") ? [{ state: "alert_end" }] : []).concat([{ state: "idle", ms: 1490 }]),
  labels: [{ text: "Mari pushed to your branch", at: 1490, ms: dur("alert") + 500 }],
});
if (has("sleep")) SCENES.push({
  title: "sleep → sleep_end → idle",
  sub: "After long inactivity. sleep_end is the wake-up transition back to idle.",
  steps: [{ state: "sleep", ms: dur("sleep") * 2 }]
    .concat(has("sleep_end") ? [{ state: "sleep_end" }, { state: "idle", ms: 1490 }] : []),
  labels: [],
});
const lvl = n => (n < 5 ? "stash_" + n : "stash_5plus");
if (has("working") && has("stash_1")) {
  const half = dur("working") / 2;
  SCENES.push({
    title: "working + stash_1 … stash_5plus, then uneasy + stash_5plus",
    sub: "One stash overlay per level; the cat frames are the same at every level.",
    steps: [1, 2, 3, 4, 5].map(n => ({ state: "working", ms: half, carry: true, overlays: [{ name: lvl(n) }] }))
      .concat([{ state: "uneasy", ms: dur("uneasy") * 2, overlays: [{ name: "stash_5plus" }] }]),
    labels: [1, 2, 3, 4, 5].map(n => ({ text: (n < 5 ? n : "5+") + " unpushed commit" + (n > 1 ? "s" : ""), at: (n - 1) * half, ms: half }))
      .concat([{ text: "5+ unpushed commits, oldest 3 days", at: 5 * half, ms: dur("uneasy") * 2 }]),
  });
}
if (has("push") && has("stash_sendoff")) {
  const hide = ATLAS.cat.push.sync.hideStashAtMs;
  SCENES.push({
    title: "working → push + stash_sendoff → idle",
    sub: "At " + hide + " ms the level sprite is swapped for stash_sendoff, which folds, follows the paw and flies off.",
    steps: [
      { state: "working", ms: dur("working") / 2, overlays: [{ name: "stash_3" }] },
      { state: "push", overlays: [{ name: "stash_3", until: hide }, { name: "stash_sendoff" }] },
      { state: "idle", ms: 1490 },
    ],
    labels: [{ text: "3 unpushed commits", at: 0, ms: dur("working") / 2 },
             { text: "You pushed 3 commits to main", at: dur("working") / 2 + 700, ms: 2600 }],
  });
}
if (has("working") && has("stash_3") && has("review_bubble")) SCENES.push({
  title: "working + stash_3 + review_bubble",
  sub: "Overlays stack: the stash sits on the ground, the bubble floats above it.",
  steps: [{ state: "working", ms: dur("working"), overlays: [{ name: "stash_3" }, { name: "review_bubble" }] }],
  labels: [],
});
if (has("walk")) SCENES.push({
  title: "walk (desktop mode)",
  sub: "Move the cat " + ATLAS.cat.walk.pxPerCycle + " px per cycle and mirror the frame when it turns left.",
  walk: true,
  steps: [{ state: "walk", ms: 2 * (SC.w - CAT.frameW) / (ATLAS.cat.walk.pxPerCycle / dur("walk")), carry: true }],
  labels: [],
});

for (const sc of SCENES) {
  for (const st of sc.steps) if (st.ms == null) st.ms = dur(st.state);
  const cycle = sc.steps.reduce((a, s) => a + s.ms, 0);
  const ctx = card(document.getElementById("scenes"), SC.w, SC.h, sc.title, "scene", "tag", sc.sub);
  draws.push(now => {
    const t = now % cycle;
    let acc = 0, step = sc.steps[0], local = 0, catT = 0, run = 0;
    for (let i = 0; i < sc.steps.length; i++) {
      const s = sc.steps[i];
      // "carry" keeps the cat animation running across consecutive steps of the same state
      if (!(i > 0 && s.carry && sc.steps[i - 1].state === s.state)) run = acc;
      if (t < acc + s.ms) { step = s; local = t - acc; catT = t - run; break; }
      acc += s.ms;
    }
    let ox = CAT.origin.x, flip = false;
    if (sc.walk) {
      const span = SC.w - CAT.frameW, u = (t / cycle) * 2;
      flip = u > 1;
      ox = Math.round(flip ? span * (2 - u) : span * u);
    }
    const origin = { x: ox, y: CAT.origin.y };
    const W = ctx.canvas.width, H = ctx.canvas.height;
    ctx.clearRect(0, 0, W, H);
    // soft ground shadow (drawn by the app, not part of the sprites)
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.beginPath();
    ctx.ellipse((ox + 24) * S, (CAT.origin.y + CAT.baselineY) * S, 20 * S, 1.6 * S, 0, 0, Math.PI * 2);
    ctx.fill();
    const ovs = step.overlays || [];
    const z = n => ATLAS.overlays[n].z;
    const live = o => !(o.until != null && local >= o.until);
    for (const o of ovs) if (live(o) && z(o.name) === "behind") drawOverlay(ctx, o.name, local - (o.delay || 0), origin);
    const cf = frameAt(ATLAS.cat[step.state], catT);
    if (flip) {                                   // mirrored for walking left
      ctx.save(); ctx.translate((ox + CAT.frameW) * S, origin.y * S); ctx.scale(-1, 1);
      ctx.drawImage(sheets.cat, cf.x, cf.y, cf.w, cf.h, 0, 0, cf.w * S, cf.h * S); ctx.restore();
    } else blit(ctx, sheets.cat, cf, ox, origin.y);
    for (const o of ovs) if (live(o) && z(o.name) !== "behind") drawOverlay(ctx, o.name, local - (o.delay || 0), origin);
    // label: drawn as text by the app, anchored at meta.labelSlot
    for (const l of sc.labels) {
      const lt = t - l.at;
      if (lt < 0 || lt > l.ms) continue;
      const a = Math.min(1, lt / 150, (l.ms - lt) / 150);
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = "600 15px Inter, 'Segoe UI', system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const x = M.labelSlot.x * S, y = M.labelSlot.y * S + 2;
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(21,23,28,.85)"; ctx.strokeText(l.text, x, y);
      ctx.fillStyle = "#E8E6E1"; ctx.fillText(l.text, x, y);
      ctx.globalAlpha = 1;
    }
  });
}

const t0 = performance.now();
function tick(now) { for (const d of draws) d(now - t0); requestAnimationFrame(tick); }
Promise.all([sheets.cat.decode(), sheets.overlays.decode()]).then(() => requestAnimationFrame(tick));
</script>
</body>
</html>
